version : "3.9"

services:
  
    redis:
      image: redis:7-alpine
      ports:
        - "6379:6379"
      command : redis-server --save 60 1 

    rabbitmq:
      image: rabbitmq:3-management-alpine
      ports:
          - "5672:5672"    # AMQP protocol — your app connects here
          - "15672:15672"  # Web management UI — open in browser to see queues
      environment:
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest