name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: CodeHive_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=CodeHive_test;Username=postgres;Password=testpassword
      Jwt__Secret: ${{ secrets.JWT_SECRET }}
      Jwt__Issuer: CodeHive
      Jwt__Audience: CodeHive-Users

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodeHive.slnx

      - name: Build
        run: dotnet build CodeHive.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CodeHive.slnx --no-build --configuration Release --verbosity normal
